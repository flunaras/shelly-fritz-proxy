# /etc/shelly-fritz-proxy/shelly-fritz-proxy.conf
#
# Configuration file for shelly-fritz-proxy — a service that pretends to be
# a Shelly Pro 3 EM on the local network and feeds it with measurements
# polled from a FRITZ!Smart Energy 250 connected to a FRITZ!Box.
#
# Each key corresponds to a command-line flag with the same name (strip the
# leading --). Command-line arguments always override values set here, and
# environment variables (FRITZ_URL, FRITZ_PASSWORD, …) always override file
# values too.
#
# The file is read automatically at startup when it exists at this path.
# Use --config /alternative/path on the command line (or in a systemd
# drop-in) to load a different file instead.
#
# All lines below are commented out and show the built-in default values
# (except the secret fields, which have no default and *must* be set).
# Uncomment and edit the lines you want to change.

## ── FRITZ!Box upstream ───────────────────────────────────────────────────────

# FRITZ!Box base URL. Point this at fritzhome-cache (e.g.
# http://fritzhome-cache.lan:8080) instead of the box directly to benefit
# from request coalescing and response caching.
# fritz-url = https://fritz.box

# REST API base path. The FRITZ!Smart Home REST API lives under /api/v0
# on a real FRITZ!Box; override only if you front the box with a reverse
# proxy that mounts it elsewhere.
# fritz-base-path = /api/v0

# FRITZ!Box user with SmartHome permission. *Do not use your admin
# account.* Create a dedicated user in the FRITZ!Box web UI and grant it
# only the SmartHome permission.
# fritz-user =

# FRITZ!Box password for the user above. Stored in plain text here — make
# sure /etc/shelly-fritz-proxy/ is mode 0750 and owned by root.
# fritz-password =

# FRITZ! Smart Home unit UID. For an FSE 250 connected via DECT-ULE this
# is the 12-digit Actor Identification Number (AIN) printed on the device
# sticker. May be entered with or without the internal space AVM prints
# on the sticker ("11657 0123456" and "116570123456" are equivalent and
# both normalized to the same value).
#
# NOTE: some FSE 250 firmware revisions split metering into two
# sub-units instead of exposing it on a bare unit equal to the device
# UID: "<AIN>-1" (the general bidirectional grid-connection reading —
# what this proxy needs) and "<AIN>-2" (a feed-in-only reading, not
# suitable here — it would not report grid *import*, feeding wrong-sign
# data to your inverter). If `shelly-fritz-proxy check` reports
# "UID_NOT_FOUND: no valid unit for given uid" even though the device
# itself is found, try appending "-1" to the bare AIN.
# fritz-unit = 11657 0123456

## ── Shelly listener ──────────────────────────────────────────────────────────

# Address the proxy binds to. Real Shelly devices listen on port 80 and
# most Shelly clients hard-code that port; if you bind elsewhere, make
# sure your consumer (Solakon ONE, EVCC, …) supports a custom port.
# listen = :80

# IP to advertise via mDNS. Leave empty to auto-detect.
# advertise-ip =

# Virtual MAC address the fake Shelly should report. Any value works; pick
# something stable and unique on your LAN.
# mac = AA:BB:CC:11:22:33

## ── Phase mapping ────────────────────────────────────────────────────────────

# How to map the single FSE 250 channel onto the three phases a Shelly
# Pro 3 EM normally reports. Options:
#
#   split  — divide the total evenly across L1/L2/L3 (default; works with
#            Solakon ONE, EVCC, openWB, and most other clients)
#   a      — put everything on L1, leave L2/L3 at zero (more honest but
#            breaks clients that require all three phases to be non-null)
#
# phase-mode = split

## ── Polling and discovery ────────────────────────────────────────────────────

# How often to poll the FRITZ!Box.
#
# The FRITZ!Smart Energy 250 talks to the FRITZ!Box over DECT-ULE and
# refreshes the FRITZ!Box's internal cache approximately every 2 seconds.
# The default poll interval matches that:
#
#   poll = 2s    → the recommended value for almost everyone.
#   poll = 5s    → fine, slightly stale data; less network chatter.
#   poll = 10s   → still fine for a slow Solakon ONE control loop.
#   poll = 500ms → DO NOT do this. The FRITZ!Box will return the same
#                  cached value across multiple polls, the stuck-data
#                  safeguard will trip during normal operation, and
#                  the proxy will repeatedly declare HealthStale.
#
# See docs/architecture.md ("Real-time vs polled data") for the full
# end-to-end latency budget and why a real Shelly Pro 3 EM is always
# ~3-5x faster than this proxy can ever be.
# poll = 2s

# Disable mDNS / Bonjour announcement. Set to true if your consumer
# already knows the proxy's static IP and you don't want it discoverable.
# no-mdns = false

## ── Logging ──────────────────────────────────────────────────────────────────

# Log verbosity written to stderr (collected by journalctl when run under
# systemd). One of: debug, info, warn, error.
# log-level = info

## ── Safeguards (the most important section for closed-loop use) ─────────────
#
# FRITZ!Smart Energy 250 meters have a few well-known failure modes
# that can produce wrong readings without warning:
#
#   - The FRITZ!Box internal cache for the meter sometimes does not
#     refresh for a couple of minutes, so the REST API keeps serving
#     byte-for-byte identical values.
#   - The DECT-ULE radio link to the meter can drop without the
#     FRITZ!Box immediately marking it offline.
#   - The meter occasionally emits a one-sample glitch (impossible
#     voltage, 32 kW spike, …) that a downstream regulator would treat
#     as a real change.
#
# Acting on bad data with an inverter regulator like Solakon ONE means
# either over-feeding into the grid or pulling power that isn't there.
# These safeguards classify every incoming sample as Accept / Reject /
# Stale and let the proxy report a safe response to its clients when
# the data is no longer trustworthy.
#
# All values below show the built-in default.

# Wall-clock budget for "this data is still fresh". Once exceeded with
# no successfully-accepted sample, the proxy reports stale.
# max-age = 30s

# Consecutive byte-equal samples (on the raw integer power value, and
# voltage when stuck-match-voltage is on) that mark the FRITZ! cache as
# stuck. 0 disables the check. This is the most reliable indicator of
# the FRITZ! cache-stall failure mode.
# stuck-cycles = 5

# Also require byte-equal voltage to declare the sample stuck. Without
# this, a constant DC load on a stable grid will trip the guard.
# stuck-match-voltage = true

# Consecutive Accept verdicts required to clear a Stale/Degraded state.
# Prevents one good sample after a long stall from immediately
# re-enabling regulation.
# recovery-samples = 3

# Plausibility bounds for voltage (single sample is rejected outside).
# min-voltage = 180
# max-voltage = 280

# Plausibility ceiling for |active power|, watts. 0 disables.
# max-abs-power = 30000

# Maximum |Δ active power| between two consecutive samples, watts. A
# single 32 kW glitch next to a stable 500 W reading will trip this.
# 0 disables.
# max-step = 15000

# Refuse to accept samples while the FRITZ!Box reports the device offline.
# require-connected = true

## ── Fail-safe policy (what to report when the safeguard says "stale") ───────
#
# Choose one of:
#
#   error        Shelly response carries errors: ['stale_data'] and the
#                measurement fields are nulled out. This matches what a
#                real Shelly Pro 3 EM does for power_meter_failure.
#                Solakon ONE *should* pause regulation when it sees this.
#                Strongly recommended default.
#
#   freeze       Last accepted measurements are returned unchanged, but
#                errors: ['stale_data'] is still set. Use when you want
#                dashboards to stay continuous while still flagging the
#                problem to clients that honor errors[].
#
#   safe_import  Report a large positive grid-import value (see
#                safe-import-watts below). Forces the inverter to
#                throttle to its minimum output. Use when Solakon
#                mishandles the error mode. Pick a value larger than
#                your inverter's peak output.
#
#   zero         Report 0 W. DANGEROUS — Solakon will increase output
#                unbounded, defeating the entire point of the safeguard.
#                Included only to document the failure mode. Never use
#                in production.
#
# stale-policy = error

# Watts to report as grid-import when stale-policy = safe_import. Must
# be larger than your inverter's peak output to guarantee throttling.
# safe-import-watts = 5000

## ── Product allowlist ───────────────────────────────────────────────────────
#
# Only bidirectional meters can correctly distinguish between grid
# import and export. As of this writing only the FRITZ!Smart Energy 250
# is bidirectional in the FRITZ! Smart Home lineup. Using an FSE 200 or
# 210 on a grid connection would silently feed a wrong-sign value to
# any inverter and cause real damage. The proxy refuses to start (and
# the `check` subcommand exits non-zero) when the configured unit is
# on a product that does not match this allowlist.
#
# Comma-separated; substring match (case-insensitive).
# product-allowlist = FRITZ!Smart Energy 250

# Disable the allowlist check entirely. Only do this if you have
# manually verified that your meter is bidirectional.
# product-allowlist-disabled = false

## ── Forecast mode ────────────────────────────────────────────────────────────
#
# A consumer that polls this proxy much faster than the FRITZ!Box
# refreshes its cached measurement can escalate its own output without
# bound: it reads "50 W import", increases its own output by 50 W, then
# reads the *same stale* 50 W again before FRITZ has refreshed, and
# increases by another 50 W, and so on.
#
# Forecast mode counters this by also reading back the current power
# output of the configured solar-battery device(s) on every poll cycle.
# When the FRITZ reading is unchanged from the previous poll (almost
# certainly a stale cache, see stuck-cycles above), the proxy reports
#
#   remembered_fritz_value - current_battery_sum + remembered_battery_sum
#
# instead of the stale raw value, backing out however much the
# battery's own output has moved since the last genuine FRITZ reading.
# See the README's "Forecast mode" section for the full worked example.
#
# forecast-mode = false

# Solar-battery devices to read back for forecast mode. A single,
# semicolon-separated list of comma-separated key=value entries (this
# project's flag/INI parser has no repeated-flag support). Multiple
# devices are summed together each cycle.
#
# Recognized keys per entry: type (required), host (required), port
# (implementation default; 502 for Modbus TCP), unit (Modbus unit/slave
# ID, default 1), timeout (per-device read timeout, defaults to
# battery-timeout below).
#
# The only implementation currently shipped is "solakon", for a FoxESS
# Solakon ONE read over Modbus TCP (register 39134, ACTIVE_POWER).
#
# battery-devices = type=solakon,host=192.168.1.148,port=502,unit=1

# Per-device timeout for forecast-mode battery reads, unless overridden
# per-device via "timeout=" in battery-devices above. A device that
# times out or errors contributes 0 W for that cycle (logged at warn)
# rather than blocking the whole poll cycle.
# battery-timeout = 5s
